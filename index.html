<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Game Cam" />
    <meta name="description" content="Juegos de movimiento que se controlan con tu cuerpo frente a la cámara." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Game Cam" />
    <meta property="og:description" content="Juegos de movimiento que se controlan con tu cuerpo frente a la cámara. Funciona sin conexión." />
    <meta property="og:image" content="https://game-cam.dev-eliud-trejo.workers.dev/og-image.png" />
    <meta property="og:url" content="https://game-cam.dev-eliud-trejo.workers.dev/" />
    <meta property="og:locale" content="es_MX" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Game Cam</title>
  </head>
  <body>
    <main class="stage">
      <video id="camera" playsinline muted></video>
      <canvas id="scene"></canvas>

      <header class="hud" id="hud" hidden>
        <div class="hud-chip">
          <span class="hud-label" data-i18n="hud.players"></span><strong class="hud-value" id="players">0</strong>
        </div>
        <div class="hud-chip hud-chip--accent game-stat">
          <span class="hud-label" data-i18n="hud.score"></span><strong class="hud-value" id="score">0</strong>
        </div>
        <div class="hud-chip game-stat">
          <span class="hud-label" data-i18n="hud.lives"></span><strong class="hud-value hud-pips" id="lives"></strong>
        </div>
        <div class="hud-chip game-stat">
          <span class="hud-label" data-i18n="hud.time"></span><strong class="hud-value" id="time"></strong>
        </div>
        <div class="hud-chip game-stat">
          <span class="hud-label" data-i18n="hud.best"></span><strong class="hud-value" id="best">0</strong>
        </div>
      </header>

      <section class="overlay" id="overlay">
        <p class="overlay-eyebrow" data-i18n="intro.eyebrow"></p>
        <h1 data-i18n="title"></h1>
        <p class="overlay-message" id="message"></p>
        <div class="actions">
          <button id="start-camera">
            <!-- Phosphor "camera" icon -->
            <svg viewBox="0 0 256 256" aria-hidden="true">
              <path
                fill="currentColor"
                d="M208,56H180.28L166.65,35.56A8,8,0,0,0,160,32H96a8,8,0,0,0-6.65,3.56L75.71,56H48A24,24,0,0,0,24,80V192a24,24,0,0,0,24,24H208a24,24,0,0,0,24-24V80A24,24,0,0,0,208,56Zm8,136a8,8,0,0,1-8,8H48a8,8,0,0,1-8-8V80a8,8,0,0,1,8-8H80a8,8,0,0,0,6.66-3.56L100.28,48h55.43l13.63,20.44A8,8,0,0,0,176,72h32a8,8,0,0,1,8,8ZM128,88a44,44,0,1,0,44,44A44.05,44.05,0,0,0,128,88Zm0,72a28,28,0,1,1,28-28A28,28,0,0,1,128,160Z"
              />
            </svg>
            <span data-i18n="actions.enableCamera"></span>
          </button>
        </div>
      </section>

      <div class="corner-actions">
        <button id="fullscreen" class="corner-button" data-i18n-title="actions.fullscreen">
          <!-- Phosphor "corners-out" icon -->
          <svg viewBox="0 0 256 256" aria-hidden="true">
            <path
              fill="currentColor"
              d="M216,48V88a8,8,0,0,1-16,0V67.31l-42.34,42.35a8,8,0,0,1-11.32-11.32L188.69,56H168a8,8,0,0,1,0-16h40A8,8,0,0,1,216,48ZM98.34,146.34,56,188.69V168a8,8,0,0,0-16,0v40a8,8,0,0,0,8,8H88a8,8,0,0,0,0-16H67.31l42.35-42.34a8,8,0,0,0-11.32-11.32ZM208,160a8,8,0,0,0-8,8v20.69l-42.34-42.35a8,8,0,0,0-11.32,11.32L188.69,200H168a8,8,0,0,0,0,16h40a8,8,0,0,0,8-8V168A8,8,0,0,0,208,160ZM67.31,56H88a8,8,0,0,0,0-16H48a8,8,0,0,0-8,8V88a8,8,0,0,0,16,0V67.31l42.34,42.35a8,8,0,0,0,11.32-11.32Z"
            />
          </svg>
        </button>
        <button id="mute" class="corner-button" aria-pressed="false">
          <!-- Phosphor "speaker-high" icon -->
          <svg class="icon-sound-on" viewBox="0 0 256 256" aria-hidden="true">
            <path fill="currentColor" d="M155.51,24.81a8,8,0,0,0-8.42.88L77.25,80H32A16,16,0,0,0,16,96v64a16,16,0,0,0,16,16H77.25l69.84,54.31A8,8,0,0,0,160,224V32A8,8,0,0,0,155.51,24.81ZM32,96H72v64H32ZM144,207.64,88,164.09V91.91l56-43.55Zm54-106.08a40,40,0,0,1,0,52.88,8,8,0,0,1-12-10.58,24,24,0,0,0,0-31.72,8,8,0,0,1,12-10.58ZM248,128a79.9,79.9,0,0,1-20.37,53.34,8,8,0,0,1-11.92-10.67,64,64,0,0,0,0-85.33,8,8,0,1,1,11.92-10.67A79.83,79.83,0,0,1,248,128Z" />
          </svg>
          <!-- Phosphor "speaker-slash" icon -->
          <svg class="icon-sound-off" viewBox="0 0 256 256" aria-hidden="true">
            <path fill="currentColor" d="M53.92,34.62A8,8,0,1,0,42.08,45.38L73.55,80H32A16,16,0,0,0,16,96v64a16,16,0,0,0,16,16H77.25l69.84,54.31A8,8,0,0,0,160,224V175.09l42.08,46.29a8,8,0,1,0,11.84-10.76ZM32,96H72v64H32ZM144,207.64,88,164.09V95.89l56,61.6Zm42-63.77a24,24,0,0,0,0-31.72,8,8,0,1,1,12-10.57,40,40,0,0,1,0,52.88,8,8,0,0,1-12-10.59Zm-80.16-76a8,8,0,0,1,1.4-11.23l39.85-31A8,8,0,0,1,160,32v74.83a8,8,0,0,1-16,0V48.36l-26.94,21A8,8,0,0,1,105.84,67.91ZM248,128a79.9,79.9,0,0,1-20.37,53.34,8,8,0,0,1-11.92-10.67,64,64,0,0,0,0-85.33,8,8,0,1,1,11.92-10.67A79.83,79.83,0,0,1,248,128Z" />
          </svg>
        </button>
      </div>
      <p id="toast" class="toast" hidden></p>

      <footer class="build">#<span id="build"></span></footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
